<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>FORCE PASS QR V2.0</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
    }
    h1 { color: #ff7900; }
    .card {
      max-width: 420px;
      margin: 30px auto;
      padding: 25px;
      border: 2px solid #ff7900;
      border-radius: 16px;
    }
    .status { color: #ff7900; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ELEVENZ FORCE FC</h1>
    <h2>FORCE PASS QR V2.0</h2>
    <p id="player"></p>
    <p class="status">PROTOTYPE MODE</p>
    <p>Dynamic QR System</p>
    <p>FORCECORE COMMAND LABS</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    const testPlayers = {
      "TEST-001": "DUMMY PLAYER 001"
    };

    document.getElementById("player").textContent =
      Object.hasOwn(testPlayers, id)
        ? "TEST PLAYER: " + testPlayers[id]
        : "INVALID TEST PLAYER";
  </script>
</body>
</html>
